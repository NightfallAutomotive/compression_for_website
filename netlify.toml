# Netlify: serve the demo site from docs/. It is plain HTML, CSS and JS
# (including the built docs/js/compressor.js), so there is nothing to build.
[build]
  command = ""
  publish = "docs"

[build.environment]
  # Netlify still installs dependencies; skip Puppeteer's Chrome download,
  # which is only needed for running the tests.
  PUPPETEER_SKIP_DOWNLOAD = "true"
